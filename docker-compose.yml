x-node-base: &node-base
  image: node:22-alpine
  user: node
  working_dir: /workspace
  volumes:
    - .:/workspace

services:
  init:
    <<: *node-base
    command: sh -c "corepack yarn && corepack yarn build"

  packages:
    <<: *node-base
    command: sh -c "corepack yarn turbo run dev --filter='@shapeshift/shared-types' --filter='@shapeshift/shared-utils'"
    depends_on:
      init:
        condition: service_completed_successfully

  db-migrate:
    <<: *node-base
    working_dir: /workspace
    command: sh -c "corepack yarn db:migrate"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/microservices
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  user-service:
    <<: *node-base
    working_dir: /workspace/apps/user-service
    command: sh -c "corepack yarn start:dev"
    ports:
      - "3002:3002"
    env_file:
      - ./apps/user-service/.env
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:password@db:5432/microservices
      - SWAP_SERVICE_URL=http://swap-service:3001
      - NOTIFICATIONS_SERVICE_URL=http://notifications-service:3003
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  swap-service:
    <<: *node-base
    working_dir: /workspace/apps/swap-service
    command: sh -c "corepack yarn start:dev"
    ports:
      - "3001:3001"
    env_file:
      - ./apps/swap-service/.env
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:password@db:5432/microservices
      - USER_SERVICE_URL=http://user-service:3002
      - NOTIFICATIONS_SERVICE_URL=http://notifications-service:3003
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  notifications-service:
    <<: *node-base
    working_dir: /workspace/apps/notifications-service
    command: sh -c "corepack yarn start:dev"
    ports:
      - "3003:3003"
    env_file:
      - ./apps/notifications-service/.env
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL=postgresql://postgres:password@db:5432/microservices
      - USER_SERVICE_URL=http://user-service:3002
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=microservices
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
